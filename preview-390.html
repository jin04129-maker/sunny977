<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>390 preview</title>
<style>
html,body{margin:0;padding:0;background:#d9d9dc}
#f{width:390px;height:1800px;border:0;display:block;margin:0 auto;background:#f3f3f4}
</style>
</head>
<body>
<iframe id="f" src="about:blank"></iframe>
<script>
(function(){
  try { localStorage.clear(); } catch(e){}
  var q = new URLSearchParams(location.search);
  var d = q.get('d') || 'v4';
  var f = document.getElementById('f');
  var s = q.get('s');
  function go(payload){
    var url = './index.html?d=' + d + (payload ? '#sync=' + payload.trim() : '');
    f.src = url;
  }
  if (s) { go(s); return; }
  fetch('./seed-sync.txt', { cache: 'no-store' })
    .then(function(r){ return r.text(); })
    .then(go)
    .catch(function(){ go(''); });
})();
</script>
</body>
</html>

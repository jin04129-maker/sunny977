<!doctype html>
<html lang="ko">
<head>

<meta name="robots" content="noindex,nofollow">
<title>390 preview</title>
<style>
html,body{margin:0;padding:0;background:#d9d9dc}
#f{width:390px;height:1800px;border:0;display:block;margin:0 auto;background:#f3f3f4}
</style>
</head>
<body>
<iframe id="f" src="about:blank"></iframe>
<script>
(function(){
  try { localStorage.clear(); } catch(e){}
  var q = new URLSearchParams(location.search);
  var s = q.get('s') || '';
  var url = './index.html?d=' + (q.get('d') || 'v4') + (s ? '#sync=' + s : '');
  document.getElementById('f').src = url;
})();
</script>
